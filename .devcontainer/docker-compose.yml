# Author tooling only. This file lives under .devcontainer/ on purpose: the
# repository ships no infrastructure for students (see the constitution), so do
# not move it to, or copy it into, the repository root.
#
# No authentication on MongoDB or Elasticsearch, and no ports published to the
# host: the services are reachable only from the dev container, by service name.
# VS Code forwards them on demand (see forwardPorts in devcontainer.json).
name: rag101-devcontainer

services:
  devcontainer:
    # Same base image as the azdo-cli dev container (remoteUser "node"); the
    # .NET SDK and the rest are added by the features in devcontainer.json.
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    command: sleep infinity
    volumes:
      - ..:/workspaces/rag101:cached
      # Keeps the container's Linux node_modules apart from the host's, whose
      # native binaries (Vite, Tailwind) are built for another OS.
      # postcreate.sh fixes its ownership and fills it with "npm ci".
      - web-node-modules:/workspaces/rag101/web/node_modules
    environment:
      # On Linux the application reads the Bootstrap connection only from here.
      RAG_MONGODB_CONNECTION: mongodb://mongo:27017
      # Read by the integration tests; they skip when it is unset.
      # RAG_TEST_ELASTICSEARCH_USER / RAG_TEST_ELASTICSEARCH_PASSWORD are not
      # needed because security is disabled below.
      RAG_TEST_ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - mongo
      - elasticsearch

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    mem_limit: 3g
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  web-node-modules:
  mongo-data:
  es-data:
