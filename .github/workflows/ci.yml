name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Building the API also builds the frontend into wwwroot.
      - name: Build
        run: dotnet build

      # No MongoDB or Elasticsearch here: the integration tests skip themselves.
      - name: Test
        run: dotnet test --no-build
